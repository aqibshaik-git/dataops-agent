[project]
name = "dataops-agent"
version = "0.1.0"
description = "A terminal agent that does a data engineer's job on the payments platform."
readme = "README.md"
authors = [{ name = "Aqib Shaik" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.12",
    "python-dotenv>=1.1",
]

[project.scripts]
agent = "dataops_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
